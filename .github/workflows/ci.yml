name: CI

# Pull requests to main (the required check before merging is the job "summary", which fails when any job failed), a
# manual run from the Actions tab, and the release workflow (release.yml, on the merged commit). Never add push /
# schedule triggers.
on:
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: "Commit to check out (default: the commit of the event)"
        type: string
        default: ""
      version:
        description: "Version to publish (default: <Version> of Directory.Build.props)"
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      targets:
        description: "Build / test targets"
        type: choice
        default: all
        options: [all, win-x64, linux-x64, linux-arm64]
      run_gui_tests:
        description: "Run Avalonia headless GUI tests"
        type: boolean
        default: true
      publish:
        description: "Publish self-contained builds and run --selftest"
        type: boolean
        default: true

permissions:
  contents: read

# github.workflow is the caller's name when release.yml calls this file, so a release does not wait for (or cancel) a pull
# request's run. A new push to a pull request cancels its older run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.workflow == 'CI' }}

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  AVALONIA_TELEMETRY_OPTOUT: 1

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      linux_matrix: ${{ steps.set.outputs.linux_matrix }}
      has_linux: ${{ steps.set.outputs.has_linux }}
    steps:
      - id: set
        shell: bash
        env:
          # Empty on pull_request and workflow_call: every target.
          TARGETS: ${{ inputs.targets || 'all' }}
        run: |
          all='[{"rid":"win-x64","os":"windows-latest"},{"rid":"linux-x64","os":"ubuntu-24.04"},{"rid":"linux-arm64","os":"ubuntu-24.04-arm"}]'
          t="$TARGETS"
          if [ "$t" = all ]; then m="$all"; else m=$(echo "$all" | jq -c --arg t "$t" '[.[] | select(.rid == $t)]'); fi
          lm=$(echo "$m" | jq -c '[.[] | select(.rid | startswith("linux"))]')
          echo "matrix=$m" >> "$GITHUB_OUTPUT"
          echo "linux_matrix=$lm" >> "$GITHUB_OUTPUT"
          echo "has_linux=$(echo "$lm" | jq 'length > 0')" >> "$GITHUB_OUTPUT"

  test-core:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: dotnet restore --locked-mode
      - run: dotnet build -c Release --no-restore -warnaserror
      - run: dotnet test tests/Hider.Core.Tests -c Release --no-build --blame-hang-timeout 5m --logger "trx;LogFileName=core-${{ matrix.rid }}.trx" --results-directory TestResults
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-core-${{ matrix.rid }}
          path: TestResults/**
          retention-days: 14

  # Formatting and code style as .editorconfig says, whatever the targets: once, on Linux (Windows checkouts may convert
  # line endings).
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: dotnet restore --locked-mode
      - run: dotnet format Hider.slnx --verify-no-changes --no-restore
      # tools/fakeportal is not in the solution (a development tool for scripts/xvfb-strip-smoke.sh).
      - run: dotnet format tools/fakeportal/FakePortal.csproj --verify-no-changes

  # scripts/*.py: strict type checks (mypy, pyright) and lint (ruff), as configured in pyproject.toml.
  python-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install mypy pyright ruff shellcheck-py
      # busybox sh (Alpine's sh) for the installer tests, which run under every shell found and require it on CI. Not
      # busybox-static: that build prefers its own applets to PATH (FEATURE_SH_STANDALONE) and bypasses the stubs.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends busybox
      - run: mypy
      - run: pyright
      - run: ruff check scripts tests/scripts
      - run: ruff format --check scripts tests/scripts
      - run: python scripts/check_wayland_list.py
      - run: shellcheck -s sh scripts/release/install.sh.in
      - run: shellcheck scripts/xvfb-strip-smoke.sh
      # PowerShell (pwsh comes with the runner image): windows-stress.ps1 and install.bat's PowerShell part (after its
      # marker line) must parse, and PSScriptAnalyzer must find no error. They run only on Windows jobs otherwise.
      - name: PowerShell syntax and analysis
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer)) { Install-Module PSScriptAnalyzer -Scope CurrentUser -Force }
          $bat = Get-Content -Raw scripts/release/install.bat.in
          $marker = '##POWERSHELL##'
          $part = Join-Path $env:RUNNER_TEMP 'install.bat.ps1'
          Set-Content -Path $part -Value $bat.Substring($bat.IndexOf($marker) + $marker.Length).TrimStart("`r", "`n") -Encoding utf8NoBOM
          $failed = $false
          foreach ($file in @('scripts/windows-stress.ps1', $part)) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file).Path, [ref]$tokens, [ref]$errors) | Out-Null
            foreach ($e in $errors) { Write-Host "::error::$file line $($e.Extent.StartLineNumber): $($e.Message)"; $failed = $true }
            foreach ($d in @(Invoke-ScriptAnalyzer -Path $file -Severity Error)) {
              Write-Host "::error::$file line $($d.Line): $($d.RuleName): $($d.Message)"
              $failed = $true
            }
            Write-Host "$file checked"
          }
          if ($failed) { exit 1 }
      # Unit tests of scripts/ (tests/scripts, unittest; install.sh runs under dash, bash as sh and as bash, and busybox
      # sh with fake commands).
      - name: Unit tests of scripts (Python 3.12)
        run: python -m unittest discover -s tests/scripts -t . -v
      # The release packaging and the Linux installer on dummy publish outputs (release.yml does it on real ones).
      - name: Release packaging on dummy files
        run: |
          d="$RUNNER_TEMP/dummy"
          for rid in win-x64 linux-x64 linux-arm64; do mkdir -p "$d/in/Hider-$rid/Assets"; done
          touch "$d/in/Hider-win-x64/Hider.exe"
          for rid in linux-x64 linux-arm64; do printf '#!/bin/sh\necho "Hider 0.0.0"\n' > "$d/in/Hider-$rid/Hider"; done
          python scripts/make_release.py package 0.0.0 --repo "$GITHUB_REPOSITORY" --input-dir "$d/in" --out-dir "$d/out"
          XDG_DATA_HOME="$d/data" HIDER_NO_LAUNCH=1 sh "$d/out/install.sh"
          [ "$("$d/data/Hider/Hider")" = "Hider 0.0.0" ]
          test -f "$d/data/applications/Hider.desktop"
          (cd "$d/out" && sha256sum -c SHA256SUMS.txt)
      # The oldest Python the scripts support (pyproject.toml): every unit test again (they run the scripts' own code,
      # their command lines included).
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Unit tests of scripts (Python 3.10)
        run: |
          python --version
          python -m unittest discover -s tests/scripts -t . -v

  test-gui:
    # Only a manual run can turn it off (the input is empty on pull_request and workflow_call).
    if: ${{ format('{0}', inputs.run_gui_tests) != 'false' }}
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      # Linux: the packages of the tests on real services (a private dbus-daemon and PipeWire, the real libhidercap.so; they
      # never skip on CI, tests/Hider.App.Tests/Platform/LinuxTestEnvironment.cs) and of the Xvfb runs below. libhidercap.so
      # is built before the tests, whose build copies it next to them.
      - if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb xcompmgr imagemagick dbus
          build-essential libpipewire-0.3-dev pipewire pipewire-bin wireplumber gstreamer1.0-pipewire gstreamer1.0-plugins-base
          gstreamer1.0-plugins-good gstreamer1.0-tools
      - if: runner.os == 'Linux'
        run: make -C native/hidercap RID=${{ matrix.rid }}
      - run: dotnet restore --locked-mode
      - run: dotnet build -c Release --no-restore -warnaserror
      - run: dotnet test tests/Hider.App.Tests -c Release --no-build --blame-hang-timeout 5m --logger "trx;LogFileName=gui-${{ matrix.rid }}.trx" --results-directory TestResults
      # Linux strip capture end to end on Xvfb with a fake portal (scripts/xvfb-strip-smoke.sh): stage 1 (Screenshot), then
      # stage 2 (ScreenCast through a private PipeWire and libhidercap), then both with the portal refusing (FR-52).
      # Each run ends with SIGTERM: exit code 0 and areas.json written again (FR-06, FR-61).
      - if: runner.os == 'Linux'
        run: scripts/xvfb-strip-smoke.sh
      - if: runner.os == 'Linux'
        run: scripts/xvfb-strip-smoke.sh --screencast
      - if: runner.os == 'Linux'
        run: scripts/xvfb-strip-smoke.sh --deny
      - if: runner.os == 'Linux'
        run: scripts/xvfb-strip-smoke.sh --screencast --deny
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-gui-${{ matrix.rid }}
          path: TestResults/**
          retention-days: 14

  native:
    if: ${{ needs.plan.outputs.has_linux == 'true' }}
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.linux_matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      # make test loads PipeWire's client modules and configuration (no daemon).
      - run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential libpipewire-0.3-dev
          libpipewire-0.3-modules pipewire-bin
      # A compile check on each architecture (-Werror, hardening flags); publish builds the helper it ships itself.
      - run: make -C native/hidercap RID=${{ matrix.rid }}
      # CT-90: which frames a grab skips (frame_time.h), the API's checks and error paths (test_hidercap.c), and the
      # internals with the PipeWire calls wrapped (test_hidercap_internal.c), without a PipeWire daemon.
      - run: make -C native/hidercap test RID=${{ matrix.rid }}
      - uses: actions/upload-artifact@v7
        with:
          name: hidercap-${{ matrix.rid }}
          path: native/hidercap/out/${{ matrix.rid }}/libhidercap.so
          if-no-files-found: error
          retention-days: 14

  publish:
    # After every check that ran (format and the scripts' lint included: publish runs build.py): a skipped GUI test or
    # native job (not chosen, no Linux target) does not hold it back.
    if: ${{ format('{0}', inputs.publish) != 'false' && !cancelled() && !failure() }}
    needs: [plan, test-core, test-gui, native, format, python-lint]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - if: ${{ startsWith(matrix.rid, 'linux') }}
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential libpipewire-0.3-dev
      # release.yml passes the version it tags (taken from the tags, not from Directory.Build.props).
      - shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: python scripts/build.py ${{ matrix.rid }} ${VERSION:+--version "$VERSION"}
      - name: Self test on the trimmed binary
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          exe="bin/publish/${{ matrix.rid }}/Hider"
          [[ "${{ matrix.rid }}" == win-* ]] && exe="$exe.exe"
          v="$("$exe" --version | tr -d '\r')"
          echo "$v"
          if [ -n "$VERSION" ] && [ "$v" != "Hider $VERSION" ]; then echo "::error::expected Hider $VERSION"; exit 1; fi
          "$exe" --selftest
      # scripts/install.py on the build for real: the installed binary runs, and the Linux desktop entry / the Windows
      # shortcut (made through Windows PowerShell, next step) point at it.
      - name: Install with scripts/install.py
        shell: bash
        env:
          RID: ${{ matrix.rid }}
        run: |
          dest="$RUNNER_TEMP/hider-install"
          XDG_DATA_HOME="$RUNNER_TEMP/data" python scripts/install.py --dest "$dest"
          exe="$dest/Hider"
          [[ "$RID" == win-* ]] && exe="$exe.exe"
          "$exe" --version
          if [[ "$RID" == linux-* ]]; then
            entry="$RUNNER_TEMP/data/applications/Hider.desktop"
            cat "$entry"
            grep -Fqx "Exec=\"$dest/Hider\"" "$entry"
            grep -Fqx "Icon=$dest/Assets/hider.svg" "$entry"
            grep -Fqx "StartupWMClass=Hider" "$entry"
          fi
      - if: ${{ startsWith(matrix.rid, 'win') }}
        name: Desktop shortcut of scripts/install.py
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP 'hider-install'
          $link = Join-Path ([Environment]::GetFolderPath('Desktop')) 'Hider.lnk'
          $s = (New-Object -ComObject WScript.Shell).CreateShortcut($link)
          Write-Host "$link -> $($s.TargetPath) in $($s.WorkingDirectory)"
          if ($s.TargetPath -ne (Join-Path $dest 'Hider.exe') -or $s.WorkingDirectory -ne $dest) { throw 'the shortcut does not point at the install' }
      # Windows: the trimmed binary under capture and drawing load (scripts/windows-stress.ps1).
      - if: ${{ startsWith(matrix.rid, 'win') }}
        shell: pwsh
        run: scripts/windows-stress.ps1 -Exe bin/publish/${{ matrix.rid }}/Hider.exe -Seconds 90
      # The stress script's checks fail when they should: a program that exits at once (whoami.exe as Hider.exe), and
      # the real Hider with no areas (alive, nothing captured). After each run, also the 90 s one above: no work folder
      # and no Hider process left behind.
      - if: ${{ startsWith(matrix.rid, 'win') }}
        name: Stress script failure checks
        shell: pwsh
        env:
          EXE: bin/publish/${{ matrix.rid }}/Hider.exe
        run: |
          function Invoke-Stress([string[]] $Arguments) {
            $out = & pwsh -NoProfile -File scripts/windows-stress.ps1 @Arguments 2>&1 | Out-String
            $code = $LASTEXITCODE
            Write-Host $out
            [pscustomobject]@{ Code = $code; Out = $out }
          }
          function Assert-Clean {
            $left = @(Get-ChildItem ([IO.Path]::GetTempPath()) -Filter 'hider-stress-*')
            if ($left.Count -ne 0) { throw "work folders left: $($left.Name -join ', ')" }
            if (Get-Process -Name Hider -ErrorAction SilentlyContinue) { throw 'a Hider process was left running' }
          }
          Assert-Clean
          $fake = Join-Path $env:RUNNER_TEMP 'exits-at-once'
          New-Item -ItemType Directory -Path $fake | Out-Null
          Copy-Item (Join-Path $env:SystemRoot 'System32\whoami.exe') (Join-Path $fake 'Hider.exe')
          $r = Invoke-Stress @('-Exe', (Join-Path $fake 'Hider.exe'), '-Seconds', '10')
          if ($r.Code -ne 1 -or $r.Out -notmatch 'Hider exited with code' -or $r.Out -notmatch 'alive after 10 s: False') {
            throw "a program that exits at once: exit code $($r.Code)"
          }
          Assert-Clean
          $empty = Join-Path $env:RUNNER_TEMP 'no-areas.json'
          Set-Content -Path $empty -Value '{ "version": 1, "areas": [] }' -Encoding utf8NoBOM
          $r = Invoke-Stress @('-Exe', $env:EXE, '-Seconds', '10', '-AreasJson', $empty)
          if ($r.Code -ne 1 -or $r.Out -notmatch 'alive after 10 s: True, successful captures: 0 \(at least 5 needed\)') {
            throw "no areas: exit code $($r.Code)"
          }
          if ($r.Out -match 'windows stress: passed') { throw 'passed without a capture' }
          Assert-Clean
      - uses: actions/upload-artifact@v7
        with:
          name: Hider-${{ matrix.rid }}
          path: bin/publish/${{ matrix.rid }}/
          retention-days: 14

  # The Windows installers for real (python-lint covers install.sh): install.bat's failure and success paths and
  # install.py's shortcut through Windows PowerShell (the Windows-only modules of tests/scripts, skipped on Linux), then
  # install.bat on dummy publish outputs, started from PowerShell 7 as release.yml does.
  installer-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      HIDER_NO_LAUNCH: 1
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # On Windows nothing of these may be skipped (proposal P-11).
      - name: Windows-only unit tests of the installers
        shell: bash
        run: |
          python -m unittest -v tests.scripts.test_install_bat tests.scripts.test_install_windows 2>&1 | tee "$RUNNER_TEMP/windows-tests.log"
          if grep -q skipped "$RUNNER_TEMP/windows-tests.log"; then echo "::error::a Windows-only test was skipped"; exit 1; fi
      - name: Release packaging on dummy files
        shell: bash
        run: |
          d=dummy
          for rid in win-x64 linux-x64 linux-arm64; do mkdir -p "$d/in/Hider-$rid/Assets"; done
          echo dummy > "$d/in/Hider-win-x64/Hider.exe"
          for rid in linux-x64 linux-arm64; do echo dummy > "$d/in/Hider-$rid/Hider"; done
          python scripts/make_release.py package 0.0.0 --repo "$GITHUB_REPOSITORY" --input-dir "$d/in" --out-dir "$d/out"
      - shell: pwsh
        run: |
          cmd.exe /c dummy\out\install.bat installed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path installed\Hider.exe)) { throw 'Hider.exe not installed' }
          if (-not (Test-Path (Join-Path ([Environment]::GetFolderPath('Desktop')) 'Hider.lnk'))) { throw 'no desktop shortcut' }

  # The required status check of pull requests to main: red when any job failed or was cancelled (a job not chosen in a
  # manual run is skipped, which passes).
  summary:
    if: always()
    needs: [plan, test-core, test-gui, native, publish, format, python-lint, installer-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - shell: bash
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          {
            echo "| job | result |"
            echo "|---|---|"
            echo "| test-core | ${{ needs.test-core.result }} |"
            echo "| test-gui | ${{ needs.test-gui.result }} |"
            echo "| native | ${{ needs.native.result }} |"
            echo "| publish | ${{ needs.publish.result }} |"
            echo "| format | ${{ needs.format.result }} |"
            echo "| python-lint | ${{ needs.python-lint.result }} |"
            echo "| installer-windows | ${{ needs.installer-windows.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$FAILED" = true ]; then echo "::error::a job failed or was cancelled"; exit 1; fi
