name: Release

# The owner's only step is Run workflow (Actions tab, on main); README "リリース", proposal P-9. Nothing is pushed to
# main: the version comes from the tags, and the release is main's HEAD.
# 1. prepare: the version. No tag v<MAJOR.MINOR.PATCH> yet (the first release): <Version> of Directory.Build.props as it
#    is. Otherwise the latest such tag, increased by the input "bump" (minor by default: 2.x.0 -> 2.(x+1).0);
#    Directory.Build.props is not read then. Fails when main's HEAD already has a tag (released already, e.g. Run
#    workflow pressed twice: the runs queue in one concurrency group and the second would release the same commit).
# 2. ci: CI on that commit (ci.yml), publishing with that version (build.py --version, a global property over
#    Directory.Build.props).
# 3. package: the release assets (scripts/make_release.py): each target's AOT build (the default) and JIT build
#    (proposal P-14). 4. verify: the installers tried on each target, for each build (--jit for the JIT build).
# 5. release: the tag v<version> on that commit and the GitHub Release (the only job with write access).
# 6. smoke: the installers downloaded from the published release, for each build.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Part of the latest version to increase (minor: 2.x.0 -> 2.(x+1).0)"
        type: choice
        default: minor
        options: [minor, patch, major]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::Run the release workflow on main (the branch selector of Run workflow)."
          exit 1
      - uses: actions/checkout@v7
        with:
          ref: main
          # Credentials kept (the token is read-only here) so that git ls-remote below also works on a private repository.
      # The decision (tags listed, annotated ones peeled, numeric order, released already) is make_release.py
      # next-version, unit-tested in tests/scripts/test_make_release.py; it prints what it decided on stderr.
      - id: version
        shell: bash
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          sha="$(git rev-parse HEAD)"
          tags="$(git ls-remote --tags origin 'refs/tags/v*')"
          if ! version="$(printf '%s\n' "$tags" | python3 scripts/make_release.py next-version --bump "$BUMP" --head "$sha")"; then
            echo "::error::no version to release main ($sha) as: see the message above"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  ci:
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      version: ${{ needs.prepare.outputs.version }}

  package:
    needs: [prepare, ci]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # The publish outputs of the ci job (artifacts Hider-<rid> of the AOT builds and Hider-<rid>-jit of the JIT builds),
      # each into a folder of its name.
      - uses: actions/download-artifact@v8
        with:
          pattern: Hider-*
          path: artifacts
      - env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: python scripts/make_release.py package "$VERSION" --repo "$GITHUB_REPOSITORY" --input-dir artifacts --out-dir release
      - uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: release/
          if-no-files-found: error
          retention-days: 14

  # Each target runs its installer with the archive next to it (no download: the release does not exist yet), then the
  # installed binary: once per build (option --jit for the JIT build), whose --selftest names its runtime first.
  verify:
    needs: [prepare, package]
    name: verify (${{ matrix.rid }}${{ matrix.option && ', jit' || ', aot' }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64, os: windows-latest, option: "", runtime: native AOT }
          - { rid: win-x64, os: windows-latest, option: --jit, runtime: JIT }
          - { rid: linux-x64, os: ubuntu-24.04, option: "", runtime: native AOT }
          - { rid: linux-x64, os: ubuntu-24.04, option: --jit, runtime: JIT }
          - { rid: linux-arm64, os: ubuntu-24.04-arm, option: "", runtime: native AOT }
          - { rid: linux-arm64, os: ubuntu-24.04-arm, option: --jit, runtime: JIT }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      OPTION: ${{ matrix.option }}
      RUNTIME: ${{ matrix.runtime }}
      # The installers start Hider after installing; not on the runner.
      HIDER_NO_LAUNCH: 1
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: release
      # Ubuntu desktops have PipeWire; a bare runner does not, and --selftest requires the shipped libhidercap.so to load.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpipewire-0.3-0t64
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ($env:OPTION) { cmd.exe /c release\install.bat installed $env:OPTION } else { cmd.exe /c release\install.bat installed }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path (Join-Path ([Environment]::GetFolderPath('Desktop')) 'Hider.lnk'))) { throw 'no desktop shortcut' }
      - if: runner.os == 'Linux'
        run: |
          sh release/install.sh -d installed ${OPTION:+"$OPTION"}
          test -f "${XDG_DATA_HOME:-$HOME/.local/share}/applications/Hider.desktop"
      - name: Installed binary
        shell: bash
        env:
          RID: ${{ matrix.rid }}
        run: |
          exe=installed/Hider
          [[ "$RID" == win-* ]] && exe="$exe.exe"
          v="$("$exe" --version | tr -d '\r')"
          echo "$v"
          [ "$v" = "Hider $VERSION" ]
          out="$("$exe" --selftest | tr -d '\r')"
          echo "$out"
          [ "$(echo "$out" | head -n 1)" = "runtime: $RUNTIME" ]

  # The tag v<version> on the released commit and the GitHub Release. A re-run after a failure here adds the assets to
  # the release made already.
  release:
    needs: [prepare, package, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: v${{ needs.prepare.outputs.version }}
      SHA: ${{ needs.prepare.outputs.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: release
      - run: |
          assets=(release/Hider-* release/install.bat release/install.sh release/SHA256SUMS.txt)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --target "$SHA" --title "Hider $VERSION" \
              --notes-file release/release-notes.md --generate-notes
          fi

  # The installers downloaded from the published release, downloading the archive as a user's would, for each build.
  smoke:
    needs: [prepare, release]
    name: smoke (${{ matrix.rid }}${{ matrix.option && ', jit' || ', aot' }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64, os: windows-latest, option: "", runtime: native AOT }
          - { rid: win-x64, os: windows-latest, option: --jit, runtime: JIT }
          - { rid: linux-x64, os: ubuntu-24.04, option: "", runtime: native AOT }
          - { rid: linux-x64, os: ubuntu-24.04, option: --jit, runtime: JIT }
          - { rid: linux-arm64, os: ubuntu-24.04-arm, option: "", runtime: native AOT }
          - { rid: linux-arm64, os: ubuntu-24.04-arm, option: --jit, runtime: JIT }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/v${{ needs.prepare.outputs.version }}
      OPTION: ${{ matrix.option }}
      RUNTIME: ${{ matrix.runtime }}
      HIDER_NO_LAUNCH: 1
    steps:
      # Ubuntu desktops have PipeWire; a bare runner does not, and --selftest requires the shipped libhidercap.so to load.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpipewire-0.3-0t64
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Assets of a release made a moment ago can take a few seconds to be served.
          Invoke-WebRequest -UseBasicParsing -Uri "$env:URL/install.bat" -OutFile install.bat -MaximumRetryCount 5 -RetryIntervalSec 10
          if ($env:OPTION) { cmd.exe /c install.bat installed $env:OPTION } else { cmd.exe /c install.bat installed }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - if: runner.os == 'Linux'
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o install.sh "$URL/install.sh"
          sh install.sh -d installed ${OPTION:+"$OPTION"}
      - name: Installed binary
        shell: bash
        env:
          RID: ${{ matrix.rid }}
        run: |
          exe=installed/Hider
          [[ "$RID" == win-* ]] && exe="$exe.exe"
          v="$("$exe" --version | tr -d '\r')"
          echo "$v"
          [ "$v" = "Hider $VERSION" ]
          out="$("$exe" --selftest | tr -d '\r')"
          echo "$out"
          [ "$(echo "$out" | head -n 1)" = "runtime: $RUNTIME" ]
